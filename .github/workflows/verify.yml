name: Verify sample

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: CompeyDev/setup-rokit@d49be92bd9502180218c3f43e7988faa945217b0
      - run: lune run tests/Features/Behavior/Runner.spec.luau
      - run: lune run examples/ChargeAbility.luau
      - run: selene src tests examples
      - run: stylua --check src tests examples
      - run: rojo build default.project.json -o AbilityLifecycle.rbxm
